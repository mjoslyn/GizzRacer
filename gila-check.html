<!doctype html><html><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { KartView } from '/src/render/kartView.ts';
import { RACERS } from '/src/physics/racers.ts';
import { createKartState } from '/src/physics/kart.ts';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(900, 500); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x221a2a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 5, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x555555 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const cam = new THREE.PerspectiveCamera(40, 900 / 500, 0.1, 100);
const v = new KartView(RACERS.find((x) => x.id === new URLSearchParams(location.search).get('r')));
scene.add(v.root, v.fx);
const s = createKartState(0, 0, 0); s.speed = 20; s.grounded = true; s.groundY = 0;
window.shot = (t, view) => {
  for (let i = 0; i < 10; i++) v.update(s, 30, 1 / 60, t + i / 60);
  const P = { side: [4.8, 1.5, 0.6], back: [1.6, 2.6, -5], front: [2.5, 1.8, 4.5] }[view];
  cam.position.set(...P); cam.lookAt(0, 0.9, 0); r.render(scene, cam);
};
window.ready = true;
</script></body></html>
