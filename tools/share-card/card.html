<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Mania; src: url(../../public/fonts/metal-mania-latin.woff2) format('woff2'); }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; background: #160827; font-family: 'Liberation Sans', Arial, sans-serif; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: radial-gradient(ellipse 70% 90% at 78% 55%, #6a1a7a 0%, #3a0c4e 45%, #160827 80%); }
.burst { position: absolute; left: 935px; top: 330px; width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
  background: repeating-conic-gradient(from 0deg, rgba(255,90,208,0.16) 0deg 7deg, rgba(0,0,0,0) 7deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0%, #000 30%, transparent 62%); mask: radial-gradient(circle, #000 0%, #000 30%, transparent 62%); }
.rings { position: absolute; left: 935px; top: 330px; width: 0; height: 0; }
.rings i { position: absolute; border-radius: 50%; border: 3px solid; transform: translate(-50%, -50%); }
.road { position: absolute; left: -100px; right: -100px; bottom: -40px; height: 210px;
  background: linear-gradient(180deg, #2a1440 0%, #1a0c2a 100%);
  transform: perspective(500px) rotateX(55deg); transform-origin: 50% 100%; }
.road::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22px;
  background: repeating-linear-gradient(90deg, #ff3a5a 0 46px, #fff6d0 46px 92px); }
.road::after { content: ''; position: absolute; left: 50%; top: 40px; bottom: 0; width: 14px; margin-left: -7px;
  background: repeating-linear-gradient(180deg, #ffd23a 0 40px, transparent 40px 80px); }
.gator { position: absolute; right: 30px; top: 150px; width: 640px; filter: drop-shadow(0 18px 0 rgba(10,0,20,0.55)) drop-shadow(0 0 40px rgba(255,90,208,0.35)); transform: rotate(-4deg); }
.speed { position: absolute; right: 560px; top: 250px; width: 0; }
.speed b { position: absolute; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,210,58,0), #ffd23a); }
.text { position: absolute; left: 64px; top: 66px; width: 640px; }
.logo { font-family: Mania; font-size: 124px; line-height: 1; letter-spacing: 2px;
  background: linear-gradient(180deg, #fff2a0 0%, #ffd23a 40%, #ff8a1f 75%, #e8461a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 3px #2a0838; filter: drop-shadow(5px 6px 0 #ff3aa8) drop-shadow(0 10px 18px rgba(0,0,0,0.6)); transform: rotate(-3deg); transform-origin: left; }
.tag { margin-top: 18px; font-family: Mania; font-size: 34px; color: #fff6d0; letter-spacing: 6px; text-transform: uppercase; text-shadow: 3px 3px 0 #3a0f45; }
.chips { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; width: 560px; }
.chip { font-weight: 700; font-size: 22px; color: #160827; background: #ffd23a; border-radius: 999px; padding: 8px 18px; box-shadow: 3px 3px 0 #ff3aa8; }
.chip.alt { background: #3ad8ff; }
.chip.alt2 { background: #9ad83a; }
.url { position: absolute; left: 64px; bottom: 46px; font-family: Mania; font-size: 40px; color: #fff6d0; letter-spacing: 3px; text-shadow: 3px 3px 0 #3a0f45; }
.url span { color: #ffd23a; }
.play { position: absolute; left: 64px; bottom: 98px; font-weight: 700; font-size: 22px; letter-spacing: 3px; color: #ff9ae0; text-transform: uppercase; }
</style></head><body><div class="card">
<div class="burst"></div>
<div class="rings"><i style="width:520px;height:520px;border-color:rgba(58,216,255,0.35)"></i><i style="width:660px;height:660px;border-color:rgba(255,210,58,0.25)"></i><i style="width:800px;height:800px;border-color:rgba(255,90,208,0.2)"></i></div>
<div class="road"></div>

<img class="gator" src="gator-cut-0.35.png">
<div class="text">
  <div class="logo">GIZZRACER</div>
  <div class="tag">Psychedelic kart racing</div>
  <div class="chips"><span class="chip">72 tracks</span><span class="chip alt">32 racers</span><span class="chip alt2">Story mode</span><span class="chip alt">Live recordings</span></div>
</div>
<div class="play">Play free in your browser</div>
<div class="url"><span>www.</span>gizzracer.com</div>
</div></body></html>
